name: CI

# Gate de qualidade: todo PR precisa deste workflow verde para entrar na master.
# O check obrigatório na proteção da branch é o job "CI ok".
on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  workflow_dispatch:

# Runner: PRs sempre em máquinas do GitHub (código de terceiros nunca roda no
# self-hosted). Push na master e dispatch usam o self-hosted se vars.SELF_HOSTED_RUNNER == 'true'.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, tipos e testes
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","cube-solver"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Cobertura no resumo do job
        if: always()
        run: node scripts/coverage-summary.mjs

  build:
    name: Build e orçamento de bundle
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","cube-solver"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size

  e2e:
    name: E2E (Playwright)
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","cube-solver"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Segredos e dependências
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted","linux","x64","cube-solver"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (histórico completo)
        run: scripts/install-gitleaks.sh && PATH="$HOME/.local/bin:$PATH" scripts/gitleaks.sh history
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      # Exige o dependency graph ligado no repo (Settings › Code security).
      # Ligue-o e crie a variável de repositório DEPENDENCY_GRAPH_ENABLED=true.
      - name: Dependency review
        if: github.event_name == 'pull_request' && vars.DEPENDENCY_GRAPH_ENABLED == 'true'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  conventions:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Commits do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE" --to "$HEAD" --verbose
      # O merge é squash: o título do PR vira o commit na master e entra no CHANGELOG.
      - name: Título do PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint --verbose

  ci-ok:
    name: CI ok
    if: always()
    needs: [quality, build, e2e, security, conventions]
    runs-on: ubuntu-latest
    steps:
      - name: Todos os jobs passaram (ou foram pulados de propósito)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
